name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          output=$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            diagnostic=$(printf '%s\n' "$output" | sed -n '/FAILURE: Build failed/,$p' | head -80)
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            echo "::error file=pubspec.yaml,title=Flutter ${{ matrix.target }} failure details::$diagnostic"
            while IFS= read -r line; do
              echo "::error file=analysis_options.yaml,title=Flutter analyze::$line"
            done < <(echo "$output" | tail -40)
          fi
          exit "$status"

      - name: Test
        run: flutter test

      - name: Build web
        shell: bash
        run: |
          set +e
          output=$(flutter build web --release 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=pubspec.yaml,title=Flutter web build::$line"
            done < <(echo "$output" | tail -40)
          fi
          exit "$status"

  build-platforms:
    name: Build ${{ matrix.target }}
    needs: validate
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Android
            os: ubuntu-latest
            command: flutter build apk --debug --verbose
          - target: Linux
            os: ubuntu-latest
            command: flutter build linux --release
          - target: Windows
            os: windows-latest
            command: flutter build windows --release
          - target: macOS
            os: macos-latest
            command: flutter build macos --release
          - target: iOS
            os: macos-latest
            command: flutter build ios --release --no-codesign

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.target == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build ${{ matrix.target }}
        shell: bash
        run: |
          set +e
          output=$(${{ matrix.command }} 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=pubspec.yaml,title=Flutter ${{ matrix.target }} build::$line"
            done < <(echo "$output" | tail -60)
          fi
          exit "$status"
