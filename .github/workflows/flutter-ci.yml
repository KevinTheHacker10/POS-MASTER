name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check Dart formatting
        run: dart format --output=none lib test

      - name: Analyze
        shell: bash
        run: |
          set +e
          output=$(flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=analysis_options.yaml,title=Flutter analyze::$line"
            done < <(echo "$output" | tail -40)
          fi
          exit "$status"
        continue-on-error: true

      - name: Test
        run: flutter test

      - name: Build web
        shell: bash
        run: |
          set +e
          output=$(flutter build web --release 2>&1)
          status=$?
          echo "$output"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error file=pubspec.yaml,title=Flutter web build::$line"
            done < <(echo "$output" | tail -40)
          fi
          exit "$status"
